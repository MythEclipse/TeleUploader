<!doctype html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="S3-compatible file manager backed by Telegram storage." />
    <title>TeleUploader · S3 File Manager</title>
    <script>
      // Resolve the theme before first paint. Without this the document renders in
      // the light default and snaps to dark once next-themes mounts, which is a
      // visible flash on every navigation that remounts the app.
      (() => {
        try {
          const stored = localStorage.getItem("theme");
          const system = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const dark = stored === "dark" || (stored !== "light" && system);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch {
          /* localStorage blocked — fall through to the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
