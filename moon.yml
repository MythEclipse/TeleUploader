$schema: 'https://moonrepo.dev/schemas/project.json'

# P1a — project definition for the root package. P1b moves this file to apps/api/moon.yml
# and renames `id` to `api`.
id: 'filedrop'

# The two esbuild bundles and the unit suite are the existing entry points; they are
# exposed as moon tasks unchanged so CI and deploy.sh keep working.
tasks:
  build:
    command: 'pnpm run build'
    inputs:
      - 'src/**/*'
      - 'schema.sql'
      - 'scripts/esbuild-banner.js'

  test:
    command: 'pnpm run test:unit'
    inputs:
      - 'src/**/*'
      - 'test/**/*'

  dev:
    command: 'pnpm run dev'
    options:
      # In moon v2 `local` was removed; `persistent` implies it.
      persistent: true

  db-migrate:
    command: 'pnpm run db:migrate'