$schema: 'https://moonrepo.dev/schemas/workspace.json'

# P1b: the app package moved from the repo root into apps/api.
#
# Note: in moon v2 the workspace does NOT define projects inline — each project is
# declared by its own moon.yml (via the `id` field). Listing them here is a parse error.
projects:
  globs:
    - 'apps/*'

vcs:
  provider: 'other'
  defaultBranch: 'main'