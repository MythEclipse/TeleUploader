version: 2
updates:
  # This repo installs with pnpm (see packageManager in package.json).
  # Dependabot has no `pnpm` ecosystem value: `npm` is the ecosystem that
  # reads package.json + pnpm-lock.yaml, so it stays `npm` by design.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
