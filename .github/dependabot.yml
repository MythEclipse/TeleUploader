version: 2
updates:
  # This repo installs with pnpm (see packageManager in package.json).
  # Dependabot has no `pnpm` ecosystem value: `npm` is the ecosystem that
  # reads package.json + pnpm-lock.yaml, so it stays `npm` by design.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    # Stops Dependabot PROPOSING versions too young for its own bundled pnpm.
    # Dependabot resolves with the pnpm it ships (11.x/12.x) and IGNORES this
    # repo's `packageManager` pin, and since pnpm 11 that version defaults
    # `minimumReleaseAge` to 1440 minutes — so anything published in the last day
    # is refused with ERR_PNPM_NO_MATURE_MATCHING_VERSION and the whole update
    # job dies.
    #
    # This half keeps young versions out of the queue; the paired
    # `minimumReleaseAge: 0` in pnpm-workspace.yaml stops the install FAILING if
    # one slips past just before the cooldown rolls over. Only one of the two
    # works alone — hub needed both for exactly this reason.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
