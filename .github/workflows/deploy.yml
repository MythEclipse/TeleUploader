name: Build & Deploy

# MIGRATION FREEZE: the `push: branches: [main]` trigger is disabled during the kana
# migration so each phase merge does not deploy straight to production. Restore in P5c.
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm run lint

      # Added in P0: this job already gates `build-and-deploy` via `needs: lint`, so
      # running the unit suite here makes it a hard precondition of every deploy at
      # zero extra cost. Before this, a red test suite could still reach production.
      - name: Unit tests (vitest)
        run: pnpm run test:unit

  build-and-deploy:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build dist
        run: pnpm run build

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          sed -i 's/\r$//' ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1 || { echo "SSH key invalid"; exit 1; }
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Plain systemd deploy: Nix is gone from the box (`ls /nix` → No such file
      # or directory), which is why the old store copy died with
      # `error: cannot connect` on every run — there is no
      # /nix/var/nix/profiles/default/bin/nix-store left to talk to. deploy.sh
      # ships dist/index.js into
      # /opt/teleuploader/dist, runs `systemctl restart teleuploader`, waits for
      # `active`, probes /health on the port the running PID listens on, and
      # restores the previous dist if that probe fails.
      - name: Deploy teleuploader to VPS (systemd)
        run: VPS_SSH_KEY="$HOME/.ssh/deploy_key" ./deploy.sh --no-build
