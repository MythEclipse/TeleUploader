name: Build & Deploy

# The `push: branches: [main]` trigger is RESTORED (P5c). It was disabled for the whole
# kana migration (P0-P5b) so each phase merge could not deploy straight to production;
# the migration is merged into integration/p3b, so the freeze has served its purpose.
#
# The BLOCK form is load-bearing, not stylistic: the freeze guard was
# `/^\s{2}push:\s*$/m`, which only matches `push:` alone on a line at 2-space indent. An
# inline `push: branches: [main]` on one line would have evaded it and left the freeze
# asserted while the freeze was lifted. deploy-config.test.ts now asserts the push
# trigger is PRESENT, so a re-freeze or a silent removal is caught from both sides.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm run lint

      # Added in P0: this job already gates `build-and-deploy` via `needs: lint`, so
      # running the unit suite here makes it a hard precondition of every deploy at
      # zero extra cost. Before this, a red test suite could still reach production.
      - name: Unit tests (vitest)
        run: pnpm run test:unit

  build-and-deploy:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build dist
        run: pnpm run build

      # The SPA is built HERE, not in deploy.sh. deploy.yml invokes
      # `./deploy.sh --no-build` (below), so deploy.sh's `if $DO_BUILD` block never
      # executes in CI — a SPA build added there would be dead code on the only path
      # that reaches production.
      #
      # It must sit BETWEEN `Build dist` and the deploy step: deploy.sh --no-build
      # asserts apps/web/dist/index.html exists and refuses to ship a stale SPA whose
      # sources are newer than the bundle, so building it later would fail the deploy.
      #
      # pnpm, not the Bun toolchain the repo's CLAUDE.md mandates: deploy-config.test.ts
      # asserts this file contains neither a Bun setup action nor a Bun install.
      - name: Build SPA
        run: pnpm --filter @teleuploader/web run build

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          sed -i 's/\r$//' ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1 || { echo "SSH key invalid"; exit 1; }
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Plain systemd deploy: Nix is gone from the box (`ls /nix` → No such file
      # or directory), which is why the old store copy died with
      # `error: cannot connect` on every run — there is no
      # /nix/var/nix/profiles/default/bin/nix-store left to talk to. deploy.sh
      # ships dist/index.js, apps/api/drizzle/ and apps/web/dist/ (as $STAGE/web)
      # into /opt/teleuploader/dist,
      # applies pending migrations with `node dist/migrate.js`, runs
      # `systemctl restart teleuploader`, waits for `active`, and probes /health on
      # the port the running PID listens on.
      #
      # ROLLBACK SEMANTICS — two windows, and a failure between them is deliberately
      # fatal rather than automatic:
      #   before migrations — the whole bundle reverts to the previous release. Safe:
      #     the database was never touched, so the old binary still matches it.
      #   after  migrations — HARD STOP, nothing is reverted. The migrations are NOT
      #     reversible: 0002 makes buckets.organization_id NOT NULL with no default and
      #     drops the global buckets_name_key, so the previous release's binary cannot
      #     read the new schema. Rolling back would trade a loud failure for a service
      #     that cannot serve a request. A human decides instead.
      #
      # The migration runs inside deploy.sh, not as a separate CI step: it needs the
      # app's env, which only exists on the VPS via bws-exec, and it must be ordered
      # against the install and the restart. Running it from CI would split that
      # transaction in two.
      - name: Deploy teleuploader to VPS (systemd)
        run: VPS_SSH_KEY="$HOME/.ssh/deploy_key" ./deploy.sh --no-build
