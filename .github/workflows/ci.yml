name: CI

# Added in P0 of the kana migration. This repo previously had NO pull_request CI:
# the only gate was `deploy.yml`, which fired on push to main and shipped straight to
# production. That combination made a big-bang migration unreviewable, so this
# workflow runs the same lint + unit checks on every PR that gate the deploy.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm run lint

  test:
    runs-on: ubuntu-latest

    # WHY A POSTGRES SERVICE EXISTS HERE
    #
    # `tenant-isolation.test.ts` and `s3-credential-lookup.test.ts` are the only
    # suites that instantiate the REAL repository against a REAL database, and
    # they are the only coverage of the P3 tenancy invariants: that `create()`
    # stamps an organization, that `delete()` reports success, and that a
    # cross-tenant lookup is invisible rather than forbidden.
    #
    # Until this service existed, CI ran `test:unit` with no DATABASE_URL, so
    # those suites reported "passed" having asserted nothing — the gate could not
    # detect a regression in the exact bugs they were written for. They guarded
    # every assertion with `if (!live) return;`, and vitest counts a silent early
    # return as PASSED.
    #
    # They now skip VISIBLY when no database is configured (so the summary line
    # says "skipped", not "passed"), and they FAIL when one is configured but
    # unusable — a broken CI database must never be downgraded to a green skip.
    # This service is what makes the "skip" branch unreachable here, turning the
    # coverage from nominal into real.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: filedrop
          POSTGRES_PASSWORD: filedrop
          POSTGRES_DB: filedrop_test
        ports:
          - 5432:5432
        # GitHub only marks the job healthy once the container accepts
        # connections; without this the first `psql` races the server's boot.
        options: >-
          --health-cmd "pg_isready -U filedrop -d filedrop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Job-wide, so BOTH the provisioning step and the test run see the same
      # DSN. Previously the value lived only in the test process, which is why a
      # missing or wrong database went unnoticed.
      DATABASE_URL: postgresql://filedrop:filedrop@127.0.0.1:5432/filedrop_test

      # `apps/api/src/env.ts` throws at import on any missing required variable, and
      # both the Drizzle migrator and the unit suites import it while reading nothing
      # but `databaseUrl`. That coupling meant this job needed Telegram credentials
      # to create a table, and it had none, so `pnpm --filter filedrop exec tsx
      # src/infrastructure/persistence/drizzle/migrate.ts` failed with "Missing
      # environment variables: BOT_TOKENS" and EVERY run of this job was red.
      #
      # BOT_TOKENS is genuinely no longer required at import (env.ts warns instead of
      # throwing; the Telegram handler enforces it at start), but these three remain
      # mandatory, so the steps that import the config supply harmless non-secret
      # placeholders.
      #
      # SCOPED PER STEP, NOT JOB-WIDE, and BASE_URL especially so: the quarantined
      # suite reads BASE_URL and defaults to the REAL production endpoint
      # (https://upload.asepharyana.my.id). A job-wide placeholder silently
      # redirected it at 127.0.0.1:4311, where nothing listens, turning an opt-in
      # live-network run into 11 connection failures that looked like product bugs.

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # The schema has to exist before the tenancy suites can run: they insert
      # organizations/buckets and read s3_credentials for real. Two steps, in
      # order, mirroring how production gets there:
      #
      #   schema.sql  — the five pre-drizzle tables (files, buckets, ...)
      #   migrate.ts  — drizzle 0001-0003, which ADD organizations, members,
      #                 s3_credentials and buckets.organization_id
      #
      # Verified against a real database rather than assumed: applying
      # schema.sql to an empty database and then running the migrator yields all
      # eight tables with buckets.organization_id NOT NULL, which is the state
      # the two suites require. `gen_random_uuid` comes from pgcrypto, which
      # Postgres 13+ provides in core, so no extension is needed.
      #
      # The migrator is invoked via `tsx` on the TypeScript source, NOT via
      # `pnpm run db:migrate`. That script is `node dist/migrate.js` and CI has no
      # `dist/` — this job never builds. Checked rather than assumed: running it
      # as written exits 1 with `Cannot find module .../dist/migrate.js`, so the
      # naive version of this step fails the job outright.
      - name: Provision the test database
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f apps/api/schema.sql
          pnpm --filter filedrop exec tsx src/infrastructure/persistence/drizzle/migrate.ts
        env:
          # env.ts throws at import on these; migrate.ts imports it for
          # `databaseUrl` alone. Placeholders only — nothing here is asserted or
          # dialled.
          STORAGE_CHANNEL_ID: "-1001234"
          BASE_URL: http://127.0.0.1:4311
          PORT: "4311"

      - name: Unit tests (vitest, 34 files)
        run: pnpm run test:unit
        env:
          STORAGE_CHANNEL_ID: "-1001234"
          BASE_URL: http://127.0.0.1:4311
          PORT: "4311"

      # The 5 quarantined suites hit the live production endpoint and create/destroy
      # real buckets, so they stay opt-in via workflow_dispatch rather than running
      # on every PR.
      #
      # The condition is the EVENT ONLY. An earlier attempt added
      # `&& secrets.ADMIN_API_TOKEN != ''`, which does not work: `secrets` context
      # is not available in a step-level `if`, and the run died with "This run
      # likely failed because of a workflow file issue" — no jobs at all, which is a
      # worse failure than the one it was fixing.
      #
      # The missing-credentials problem is real but belongs to the secrets, not to
      # this condition: the repository has neither ADMIN_API_TOKEN nor
      # S3_SECRET_KEY, so a maintainer who dispatches CI gets 12 failures from the
      # live-network suites that say nothing about the commit under test. Adding
      # the two secrets makes the dispatch meaningful; until then, dispatch is only
      # useful for the non-quarantined jobs.
      - name: Quarantined suites (live network — opt-in)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: pnpm run test:quarantine
        env:
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}

  # scripts/verify-migrations.ts was previously referenced by NOTHING except a
  # toContain() string in deploy-config.test.ts — a test asserting a file exists, which
  # says nothing about whether it runs. It is the only check that applies the real
  # migration path (schema.sql → dist/migrate.js → seed.ts) and asserts the schema a
  # deploy depends on: buckets.organization_id NOT NULL, zero orphaned rows, preserved
  # row counts, and a journal whose tags all have .sql files.
  #
  # It needs a live PostgreSQL because it exercises real DDL, hence the service block.
  # The database name is deliberately scratch-shaped (probe_*) because the harness
  # REFUSES to write to anything else without --allow-non-scratch — that guard is the
  # only thing standing between this job and a production URL typo.
  verify-migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kana
          POSTGRES_PASSWORD: kanaprobe
          POSTGRES_DB: probe_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # The harness executes apps/api/dist/migrate.js — the exact binary deploy.sh
      # ships — so it needs a build first.
      - name: Build dist
        run: pnpm run build

      - name: Verify the migration path (real DDL against a scratch database)
        run: pnpm --filter filedrop run verify:migrations --allow-writes
        env:
          DATABASE_URL: postgresql://kana:kanaprobe@127.0.0.1:5432/probe_ci
          BOT_TOKENS: 1:test
          STORAGE_CHANNEL_ID: "-1001234"
          BASE_URL: http://127.0.0.1:4311
          PORT: "4311"