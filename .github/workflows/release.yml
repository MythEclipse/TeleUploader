name: Release (image publish)

# TRIGGER: a `v*` TAG, not a push to main.
#
# This workflow used to run semantic-release on every push to main, derive a
# version from the commit prefixes, and commit the result back. That made CI the
# owner of the version number, and it had two consequences this repo lived with:
#
#   1. apps/api and apps/web stayed frozen on 1.2.9 while the root moved to
#      1.12.19, because the prepare hook only rewrote the root manifest.
#   2. Nothing on a workstation could tell you what the next version would be —
#      the answer only existed inside a runner.
#
# The version is now decided BEFORE the push, by `scripts/bump-version.mjs` in
# the lefthook `pre-push` hook, which rewrites every manifest and creates the
# `vX.Y.Z` tag locally. This workflow's only remaining job is to turn that
# already-decided version into published images. It reads `package.json`, so
# there is exactly one source of truth and no second derivation to drift.
#
# `workflow_dispatch` stays, with a `tag` input, so an existing release can be
# republished without re-tagging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to (re)publish"
        required: true
        type: string

permissions:
  contents: read
  # The image push needs this and nothing else in this list provides it. Without
  # it the build succeeds and the push fails at the last step with
  #   denied: installation not allowed to Create organization package
  # which reads like a registry or token problem rather than a missing scope.
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Validate tag
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # The image jobs below read this. The value is READ from the checked-out
    # manifest, never computed — bump-version.mjs already decided it.
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 1

      - name: Read version and validate the tag agrees
        id: publish
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        # The tag and package.json must match. They are written together by
        # bump-version.mjs, so a mismatch means someone tagged by hand or edited
        # a manifest afterwards — and publishing an image whose tag disagrees
        # with the version baked into it is worse than failing here.
        run: |
          set -Eeuo pipefail
          version=$(node -p 'require("./package.json").version')

          # Docker tags allow a narrower character set than semver, and `1` or
          # `latest` are both legal tags that would quietly overwrite the wrong
          # image. Validate before this value becomes a tag.
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json version '$version' is not a Docker-safe semver version"
            exit 1
          fi
          if [[ "v$version" != "$RELEASE_TAG" ]]; then
            echo "::error::tag '$RELEASE_TAG' does not match package.json version 'v$version'"
            echo "The bump script writes both; a mismatch means one was edited by hand."
            exit 1
          fi

          # The workspace manifests must agree with the root. They are bumped
          # together precisely so a stale one cannot ship a wrong version.
          for manifest in apps/api/package.json apps/web/package.json; do
            other=$(node -p "require('./$manifest').version")
            if [[ "$other" != "$version" ]]; then
              echo "::error::$manifest is on $other but the release is $version"
              exit 1
            fi
          done

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version from $RELEASE_TAG"

  prepare:
    name: Resolve images
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      images: ${{ steps.resolve.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - id: resolve
        env:
          VERSION: ${{ needs.release.outputs.version }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -Eeuo pipefail
          # The version was validated against the tag in the job above, which is
          # also where the manifest cross-check happens. It is re-asserted here
          # only because an empty value would turn every `:${version}` below into
          # a `:latest` push, silently overwriting the wrong image.
          version="$VERSION"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version '$version' is not a Docker-safe semver version"
            exit 1
          fi

          # The image list is repo config, not a hardcoded matrix, so adding a
          # service is a one-line change rather than a workflow edit that can
          # conflict with whatever else is in flight.
          images=$(jq -c '.images | map(select(.enabled != false))' .github/docker-images.json)
          if [[ "$(jq 'length' <<<"$images")" -eq 0 ]]; then
            echo "::error::.github/docker-images.json enables no images"
            exit 1
          fi

          # Every entry needs its Dockerfile and .dockerignore present AND
          # git-tracked. buildx builds from this checkout, so an untracked
          # Dockerfile fails later as a bare "unable to prepare context" naming
          # neither the image nor the cause. A missing .dockerignore does not
          # fail at all: it ships node_modules and .git inside the image.
          while IFS= read -r img; do
            package=$(jq -r '.package' <<<"$img")
            context=$(jq -r '.context' <<<"$img")
            file=$(jq -r '.file' <<<"$img")
            # The package name becomes a repository name in the registry path,
            # where only lowercase alphanumerics and separators are legal.
            [[ "$package" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] \
              || { echo "::error::$package is not a valid GHCR package name (lowercase [a-z0-9._-])"; exit 1; }
            for path in "$context/$file" "$context/.dockerignore"; do
              [[ -f "$path" ]] || { echo "::error::$package: missing $path"; exit 1; }
              git ls-files --error-unmatch "$path" >/dev/null \
                || { echo "::error::$package: $path is not tracked by git — CI cannot see it"; exit 1; }
            done
          done < <(jq -c '.[]' <<<"$images")

          echo "images=${images}" >>"$GITHUB_OUTPUT"
          {
            echo "### Publishing ${version}"
            echo ""
            echo "| Image | Tag |"
            echo "|---|---|"
            # A bash loop rather than a jq interpolation program: the jq form
            # needs backticks and \(...) inside a single-quoted program nested
            # in a YAML run: block, which is hard to review and untestable
            # offline. The package name is already validated as [a-z0-9._-].
            while IFS= read -r package; do
              echo "| \`ghcr.io/${GHCR_OWNER,,}/${package}\` | \`ghcr.io/${GHCR_OWNER,,}/${package}:${version}\` |"
            done < <(jq -r '.[].package' <<<"$images")
          } >>"$GITHUB_STEP_SUMMARY"

  docker:
    name: Publish ${{ matrix.image.package }}
    needs: [release, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Job-level matrix, reading the PREVIOUS JOB's output — which is legal in
    # this context, unlike a step output from the same job.
    strategy:
      # One broken image must not cancel its siblings: a monorepo where web
      # fails should still publish api, rather than leaving the release with no
      # images at all.
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.images) }}
    steps:
      # The TAG, not the default branch. Building from `main` would publish an
      # image labelled with the release version while its contents came from
      # whatever landed after the tag — a green publish of the wrong bytes.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Build inputs that are fetched rather than committed. A repo whose
      # Dockerfile COPYs a gitignored dataset needs it in the checkout first, and
      # its absence surfaces only as buildx's "failed to calculate checksum of
      # ref" — which names the missing path but not the reason it is missing.
      #
      # Repo-supplied: a shell command from .github/docker-images.json, so this
      # workflow needs no per-repo knowledge and no new template per repo.
      - name: Fetch build inputs
        if: ${{ matrix.image.prebuild }}
        env:
          PREBUILD: ${{ matrix.image.prebuild }}
        run: |
          set -Eeuo pipefail
          echo "$PREBUILD" | bash -euxo pipefail

      - uses: docker/setup-buildx-action@v4

      # The default GITHUB_TOKEN is scoped to this repo's packages and is all a
      # publish needs. A PAT would work and would be a credential with a much
      # wider blast radius than this job requires.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.context }}/${{ matrix.image.file }}
          push: true
          platforms: ${{ matrix.image.platforms || 'linux/amd64' }}
          tags: |
            ghcr.io/mytheclipse/${{ matrix.image.package }}:${{ needs.release.outputs.version }}
          # Newline-separated KEY=VALUE, which is what this action parses.
          # Passing a JSON object is accepted and handed through literally, so
          # every ARG in the Dockerfile resolves empty and the build still
          # succeeds — a green run that configured nothing.
          build-args: ${{ matrix.image.build_args || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.title=${{ matrix.image.package }}
          cache-from: type=gha,scope=${{ matrix.image.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.package }}

      # The action reporting success proves layers were uploaded, not that the
      # registry accepted a manifest under the tag we asked for. Read the tag
      # back; the digest comparison also catches a concurrent publish silently
      # overwriting this tag.
      - name: Verify the published tag resolves
        env:
          IMAGE: ghcr.io/mytheclipse/${{ matrix.image.package }}:${{ needs.release.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ -n "$DIGEST" ]] || { echo "::error::buildx reported no digest"; exit 1; }
          if ! published=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}' 2>/dev/null); then
            echo "::error::$IMAGE is not visible in the registry after push"
            exit 1
          fi
          if [[ "$published" != "$DIGEST" ]]; then
            echo "::error::$IMAGE resolves to $published, expected $DIGEST — a concurrent push overwrote it"
            exit 1
          fi
          echo "$IMAGE -> $published"

      # Here rather than in its own job: each matrix leg promotes only its own
      # image, so one image failing cannot leave another unpromoted, and a
      # prerelease can never move latest — the suffix is part of the version.
      - name: Promote latest
        if: ${{ !contains(needs.release.outputs.version, '-') }}
        env:
          VERSION: ${{ needs.release.outputs.version }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -Eeuo pipefail
          if [[ '${{ matrix.image.latest }}' == 'false' ]]; then
            echo "${{ matrix.image.package }} opts out of the latest tag"
            exit 0
          fi
          docker buildx imagetools create \
            --tag "ghcr.io/${GHCR_OWNER,,}/${{ matrix.image.package }}:latest" \
            "ghcr.io/${GHCR_OWNER,,}/${{ matrix.image.package }}:${VERSION}"
          echo "ghcr.io/${GHCR_OWNER,,}/${{ matrix.image.package }}:latest -> ${VERSION}"
