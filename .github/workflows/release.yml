name: Semantic Release

# MIGRATION FREEZE: the `push: branches: [main]` trigger is disabled during the kana
# migration so each phase merge does not publish a release. Restore in P5c.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # semantic-release needs the full history + tags to analyse commits
          persist-credentials: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install semantic-release (isolated, no package.json pollution)
        run: |
          npm install --prefix /tmp/sr-tools \
            semantic-release@^24 \
            @semantic-release/changelog@^6 \
            @semantic-release/exec@^6 \
            @semantic-release/git@^10
          echo "/tmp/sr-tools/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release