name: Mirror to Gitea

# The `push` trigger is RESTORED (P5c), matching deploy.yml and release.yml. It was
# disabled for the whole kana migration (P0-P5b) because the migration lived on
# a branch that was pushed nowhere, so any merge to main would have made the mirror
# delete that branch on Gitea. The migration is now merged into integration/p3b, so
# that specific reason is gone.
#
# ## `--mirror` IS GONE (TODO item 5). It was a data-loss hazard, verified by
# ## execution rather than by reading.
#
# `actions/checkout` fetches `refs/heads/*` only — never `refs/pull/*`, never
# `refs/notes/*`. `--mirror` pushes every ref the runner HAS and DELETES every ref
# it does not, so those refs are absent and therefore deleted on Gitea.
#
# Reproduced against a scratch remote (the dry-run below is the real output):
#
#   GITEA refs BEFORE:
#     refs/heads/feature-x
#     refs/heads/main
#     refs/notes/semantic-release-1.2.9
#     refs/pull/1/head
#     refs/tags/v1.0.0
#   RUNNER refs (the input to --mirror):
#     refs/remotes/origin/feature-x
#     refs/remotes/origin/main
#     refs/tags/v1.0.0
#   $ git push --dry-run --mirror origin
#      - [deleted]         feature-x
#      - [deleted]         main                     <-- THE BRANCH ITSELF
#      - [deleted]         refs/notes/semantic-release-1.2.9
#      - [deleted]         refs/pull/1/head
#      * [new reference]   origin/main -> origin/main
#
# The `[deleted] main` line is the one that matters and it is easy to miss: the
# runner's own copy lives under `refs/remotes/origin/*`, which is a DIFFERENT ref
# namespace from the remote's `refs/heads/*`. So `--mirror` had nothing matching
# `refs/heads/main` to push, and deleted it. Every merge to main would have left
# Gitea with no `main` at all — the mirror destroying the branch it exists to copy.
#
# ## WHAT REPLACED IT, AND WHY `--force` IS STILL NOT ENOUGH
#
# Two properties are wanted: never delete a ref the runner cannot see, and never
# silently discard work pushed directly to Gitea. Explicit refspecs alone solve
# the first and only the second by accident:
#
#   git push --force origin 'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
#      + 5519370...90c11dc main -> main (forced update)
#
# A plain refspec push WITHOUT --force does reject a divergent main:
#
#      ! [rejected]  main -> main (non-fast-forward)
#
# which is the behaviour a mirror actually wants — a fast-forward is a mirror, an
# overwrite is a mistake. `--force-if-includes` is kept anyway, as a second guard:
# it rejects the push unless the remote's ref is an ANCESTOR of what we are
# pushing, so a ref that was rebased or rewritten on Gitea is refused rather than
# clobbered. Both were verified in the same scratch remote; the rejection is
# identical to the no-force case above.
#
# `--force` is what made the old version dangerous beyond ref deletion, and it is
# deliberately absent. If a future need arises for it, `--force-if-includes` is
# the version that still refuses to discard a ref whose history we do not contain.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mirror to Gitea
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        # fetch-depth: 0 above is load-bearing, not a habit. `refs/tags/*:refs/tags/*`
        # needs the tag objects, and the fast-forward check needs the shared
        # history, so a shallow clone would push a tag whose commit the remote has
        # never seen.
        #
        # The refspecs are exhaustive ON PURPOSE. `refs/heads/*` mirrors every
        # branch and `refs/tags/*` every tag; anything NOT named here is left
        # exactly as it is on Gitea, which is the whole point — refs/pull/* and
        # refs/notes/* are now invisible to this job and therefore invulnerable to
        # it. Do not "simplify" this back to `--mirror`.
        run: |
          git remote add gitea "https://oauth2:${GITEA_TOKEN}@git.imrnes.team/MythEclipse/TeleUploader.git"
          git push --force-if-includes gitea \
            'refs/heads/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'
          echo "✅ Mirrored branches + tags to Gitea (MythEclipse/TeleUploader)"
          echo "   refs/pull/* and refs/notes/* were not touched"