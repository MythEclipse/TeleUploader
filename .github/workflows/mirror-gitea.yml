name: Mirror to Gitea

# MIGRATION FREEZE (P0–P5c): the `push` trigger is disabled during the kana
# migration, matching deploy.yml and release.yml.
#
# This one is the most dangerous of the three, which is why P0 missed it. It runs
# `git push --mirror`, which is a FORCE push: it overwrites the remote's refs
# wholesale. The whole migration lives on the branch `kana-migration`, which is
# not pushed anywhere (the only remote is GitHub `origin`). While this workflow
# is armed, any merge to main makes the mirror delete `kana-migration` on Gitea
# and every phase commit with it. Restore the push trigger in P5c, once the
# migration branch is merged and no longer load-bearing.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mirror to Gitea
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git remote add gitea "https://oauth2:${GITEA_TOKEN}@git.imrnes.team/MythEclipse/TeleUploader.git"
          git push --mirror gitea
          echo "✅ Mirrored to Gitea (MythEclipse/TeleUploader)"
